name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q services training tests examples
      - run: ruff check services training tests examples
      - run: pytest -q
      - name: Validate public bootstrap source plan
        run: python -m training.data.bootstrap --language all --task both --include-eval --dry-run

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: sdk/typescript
        run: npm install --ignore-scripts
      - working-directory: sdk/typescript
        run: npm run build
