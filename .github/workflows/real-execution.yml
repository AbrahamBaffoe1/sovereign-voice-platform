name: real-voice-training

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language to execute (or all)
        required: true
        default: all
        type: choice
        options: [all, tw, gaa, ee, ha]
      min_free_gb:
        description: Minimum free space required on the persistent workspace
        required: true
        default: "150"
        type: string
      require_external_eval:
        description: Fail ASR launch if a frozen external benchmark is unavailable
        required: true
        default: false
        type: boolean
      force_reacquire:
        description: Ignore reusable source receipts and reacquire public corpus rows
        required: true
        default: false
        type: boolean
  # A workflow-file change requests a new approved execution. Normal source pushes do not start an
  # expensive training job; they only run CI until this workflow is intentionally changed/dispatches.
  push:
    branches: [main]
    paths:
      - .github/workflows/real-execution.yml

permissions:
  contents: read

concurrency:
  group: sovereign-voice-real-execution
  # During workflow setup, a newer workflow-file commit must replace a stale queued request. Manual
  # training dispatches are different: they serialize and never cancel an already running experiment.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  execute:
    # Never execute a manually dispatched copy of this workflow from a feature/PR branch. The source SHA
    # written into model lineage must be a reviewed main-branch revision.
    if: github.ref == 'refs/heads/main'
    # `sovereign-gpu` is a deliberate custom label: a generic self-hosted CPU runner must not pick up a
    # job that will download corpora and install a CUDA training stack before discovering the mismatch.
    runs-on: [self-hosted, linux, x64, sovereign-gpu]
    timeout-minutes: 4320
    env:
      VOICE_EXECUTION_ROOT: ${{ vars.VOICE_EXECUTION_ROOT || '/srv/sovereign-voice' }}
      VOICE_SOURCE_SHA: ${{ github.sha }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EXEC_LANGUAGE: ${{ inputs.language || 'all' }}
      EXEC_MIN_FREE_GB: ${{ inputs.min_free_gb || '150' }}
      EXEC_REQUIRE_EXTERNAL_EVAL: ${{ inputs.require_external_eval || false }}
      EXEC_FORCE_REACQUIRE: ${{ inputs.force_reacquire || false }}
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/training-cu124.txt
      EXPECTED_TORCH_CUDA: "12.4"

    steps:
      - name: Checkout source only
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare persistent virtual environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VOICE_EXECUTION_ROOT/state"
          if [[ ! -x "$VOICE_EXECUTION_ROOT/venv/bin/python" ]]; then
            python -m venv "$VOICE_EXECUTION_ROOT/venv"
          fi
          source "$VOICE_EXECUTION_ROOT/venv/bin/activate"
          mkdir -p "$VOICE_EXECUTION_ROOT/cache/pip"
          export PIP_CACHE_DIR="$VOICE_EXECUTION_ROOT/cache/pip"
          python -m pip install --upgrade pip wheel
          # Reinstall editable source every run, but keep the heavy environment on the persistent disk.
          python -m pip install -e '.[data,training-asr,asr,training]'
          python -m pip check
          python - <<'PY'
          import os

          import torch

          expected_cuda = os.environ["EXPECTED_TORCH_CUDA"]
          resolved_cuda = torch.version.cuda or ""
          if resolved_cuda != expected_cuda:
              raise SystemExit(f"Expected torch CUDA {expected_cuda}, resolved {resolved_cuda or 'none'}")
          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access the assigned NVIDIA GPU")
          print(
              "Verified training runtime: "
              f"torch={torch.__version__} cuda={resolved_cuda} gpu={torch.cuda.get_device_name(0)}"
          )
          PY
          # This is reproduction/debug evidence. pyproject.toml remains dependency policy; the snapshot
          # records what the real machine actually resolved on this particular model run.
          python -m pip freeze > "$VOICE_EXECUTION_ROOT/state/pip-freeze.txt"
          cp "$PIP_CONSTRAINT" "$VOICE_EXECUTION_ROOT/state/pip-constraint.txt"

      - name: Execute resumable corpus and ASR pipeline
        shell: bash
        run: |
          set -euo pipefail
          source "$VOICE_EXECUTION_ROOT/venv/bin/activate"
          args=(
            --workspace "$VOICE_EXECUTION_ROOT"
            --language "$EXEC_LANGUAGE"
            --min-free-gb "$EXEC_MIN_FREE_GB"
          )
          if [[ "$EXEC_REQUIRE_EXTERNAL_EVAL" == "true" ]]; then
            args+=(--require-external-eval)
          fi
          if [[ "$EXEC_FORCE_REACQUIRE" == "true" ]]; then
            args+=(--force-reacquire)
          fi
          python -m training.execution.run_pipeline "${args[@]}"

      - name: Print durable state paths
        if: always()
        shell: bash
        run: |
          echo "Source revision: $VOICE_SOURCE_SHA"
          echo "Execution root:  $VOICE_EXECUTION_ROOT"
          echo "Environment:     $VOICE_EXECUTION_ROOT/state/EXECUTION_ENVIRONMENT.json"
          echo "Run state:       $VOICE_EXECUTION_ROOT/state/REAL_EXECUTION.json"
          echo "Dependencies:    $VOICE_EXECUTION_ROOT/state/pip-freeze.txt"
          echo "Persistent log:  $VOICE_EXECUTION_ROOT/logs/real-execution.log"
