      mode: custom
      model_kind: local
      model: models/asr/ee
      runtime_language_hint: null
      deployment_required: true
    nemo:
      fastpitch_checkpoint: models/ewe/fastpitch.nemo
      hifigan_checkpoint: models/ewe/hifigan.nemo
      sample_rate: 22050
  gaa:
    name: Ga
    iso639_3: gaa
    aliases: [ga]
    training_profile: training/configs/languages/gaa.yaml
    tts_engine: nemo
    normalizer: ga
    asr:
      mode: custom
      model_kind: local
      model: models/asr/gaa
      runtime_language_hint: null
      deployment_required: true
    nemo:
      fastpitch_checkpoint: models/ga/fastpitch.nemo
      hifigan_checkpoint: models/ga/hifigan.nemo
      sample_rate: 22050
  ha:
    name: Hausa
    iso639_3: hau
    aliases: [hausa]
    training_profile: training/configs/languages/ha.yaml
    tts_engine: nemo
    normalizer: hausa
    asr:
      mode: custom
      model_kind: local
      model: models/asr/ha
      runtime_language_hint: null
