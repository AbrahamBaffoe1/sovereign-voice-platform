languages:
  en:
    name: English
    iso639_3: eng
    aliases: [english]
    tts_engine: chatterbox
    tts_language_id: en
    normalizer: generic
    asr:
      mode: shared
      runtime_language_hint: en
  sw:
    name: Swahili
    iso639_3: swa
    aliases: [swahili]
    tts_engine: chatterbox
    tts_language_id: sw
    normalizer: generic
    asr:
      mode: shared
      runtime_language_hint: sw
  tw:
    name: Twi (Akan)
    iso639_3: twi
    aliases: [twi, akan-twi]
    training_profile: training/configs/languages/tw.yaml
    tts_engine: nemo
    normalizer: twi
    asr:
      mode: custom
      model_kind: local
      model: models/asr/tw
      runtime_language_hint: null
      deployment_required: true
    nemo:
      fastpitch_checkpoint: models/twi/fastpitch.nemo
      hifigan_checkpoint: models/twi/hifigan.nemo
      sample_rate: 22050
  ee:
    name: Ewe
    iso639_3: ewe
    aliases: [ewe]
    training_profile: training/configs/languages/ee.yaml
